name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'compose.yaml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'compose.yaml'
              - '.github/workflows/ci.yml'
            deploy:
              - 'deploy/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      # Testcontainers uses the Docker daemon the runner already provides.
      - name: Test
        working-directory: backend
        run: ./mvnw -B verify
      - name: Test upstream contract checker with local stand-ins
        working-directory: backend
        run: python3 -m unittest tools/test_check_upstream_contracts.py

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Test the free-tier expiry check
        run: python3 -m unittest deploy/test_check_free_tier_expiry.py
      - name: Test the rollout from CI
        run: python3 -m unittest deploy/test_run_rollout.py
      - name: Test the smoke check
        run: python3 -m unittest deploy/test_smoke_check.py
      # SC2034 is excluded because the wizard library above the STAGES marker defines a
      # colour no stage uses, and that library is shared, not edited per wizard.
      - name: Check the scripts' syntax
        run: |
          for script in deploy/setup-billing.sh deploy/setup-backend.sh deploy/setup-ci.sh \
            deploy/setup-frontend.sh deploy/ec2/rollout.sh; do
            bash -n "$script"
          done
          shellcheck -e SC2034 deploy/setup-billing.sh deploy/setup-backend.sh deploy/setup-ci.sh \
            deploy/setup-frontend.sh deploy/ec2/rollout.sh
      - name: Lint the CloudFormation template
        run: pipx run cfn-lint deploy/aws.yaml
