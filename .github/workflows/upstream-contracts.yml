name: Upstream contracts

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-contracts:
    name: RxNorm and openFDA live contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Check live upstream responses
        run: python3 backend/tools/check-upstream-contracts.py
