server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Same-origin /api, matching the Vite dev proxy, so the app never needs a
    # configured API URL and no CORS headers exist anywhere. Deployment (#13) has to
    # provide the equivalent route: ADR-0009 puts this on Cloudflare Pages, which does
    # not reach EC2 without one.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
