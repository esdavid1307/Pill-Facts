<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- A two-tone capsule in the site's ink and accent (src/index.css). -->
  <clipPath id="pill"><rect x="2" y="10" width="28" height="12" rx="6"/></clipPath>
  <g transform="rotate(-45 16 16)" clip-path="url(#pill)">
    <rect x="2" y="10" width="14" height="12" fill="#c8321f"/>
    <rect x="16" y="10" width="14" height="12" fill="#0d0d0d"/>
  </g>
</svg>
